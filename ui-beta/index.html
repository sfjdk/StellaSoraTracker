<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>星塔旅人 · 三套 UI Beta 预览</title>
<link rel="icon" href="data:,">
<style>
:root{font-family:'Microsoft YaHei UI','Segoe UI',sans-serif;color:#26394a;background:#edf2f6;--accent:#216f94}
*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #3183a8;outline-offset:4px}
header{padding:26px 5vw 20px;background:#fff;border-bottom:1px solid #dbe5eb;display:flex;justify-content:space-between;align-items:center;gap:24px}
.brand{font-size:11px;letter-spacing:3px;color:#647d8d}h1{font-size:26px;letter-spacing:-.5px;margin:8px 0}p{font-size:13px;color:#718394;line-height:1.7;margin:6px 0}
.tag{font-size:12px;border:1px solid #dce5ec;padding:8px 12px;border-radius:30px;white-space:nowrap}
main{max-width:1530px;margin:auto;padding:22px 4vw 35px}.directions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.direction{padding:16px 20px;border:1px solid #d5dfe6;border-radius:12px;text-align:left;background:#fff;display:flex;align-items:center;gap:15px;color:#334a5b}
.direction[aria-pressed=true]{border:2px solid var(--accent);padding:15px 19px;box-shadow:0 3px 15px #24445c0b}
.swatch{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:18px;flex-shrink:0}.a{background:#1c304c;color:#8bceef}.b{background:#e4f2fa;color:#216f94}.c{background:#eee5f5;color:#755481}
.direction strong{display:block;font-size:14px}.direction small{font-size:11px;color:#7a8b9a;display:block;margin-top:5px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}.pages{display:flex;gap:6px;flex-wrap:wrap}.pages button,.compare{border:0;border-radius:7px;background:transparent;padding:9px 13px;color:#728492;font-size:12px}.pages button[aria-pressed=true]{background:#fff;color:var(--accent);font-weight:700}.compare{border:1px solid #ccdce6}
.frame{background:#fff;border:1px solid #d7e3eb;border-radius:12px;overflow:hidden;box-shadow:0 16px 48px #1b3c5810}.frame img{display:block;width:100%;height:auto}.frame a{display:block}.caption{display:flex;justify-content:space-between;padding:13px 18px;border-bottom:1px solid #e2e9ef;font-size:12px;color:#758999}.caption strong{color:#2d485b}.caption a{display:inline;color:#477c98;text-decoration:none}
.comparison{display:none;grid-template-columns:repeat(3,1fr);gap:12px}.comparison figure{margin:0;border:1px solid #d7e3eb;background:white;border-radius:8px;overflow:hidden}.comparison img{width:100%;display:block}.comparison figcaption{padding:12px;font-size:12px;font-weight:700}.note{display:flex;justify-content:space-between;gap:20px;margin-top:18px;align-items:center}.note a{color:#3c7291;font-size:12px}code{font:12px Consolas,monospace;color:#395a72;background:white;border:1px solid #d9e3e9;padding:10px 14px;border-radius:7px;white-space:nowrap}.launch{font-size:12px;color:#667d8e;display:flex;align-items:center;gap:12px}footer{font-size:11px;color:#8395a2;margin-top:18px}.hidden{display:none!important}
@media(max-width:750px){header{align-items:flex-start;padding:22px}.tag{display:none}main{padding:18px}.directions{gap:8px}.direction{padding:12px;display:block}.direction[aria-pressed=true]{padding:11px}.direction small{display:none}.swatch{margin-bottom:8px}.note{display:block}.launch{display:block}.launch code{display:block;overflow:auto;margin-top:10px}.comparison{grid-template-columns:1fr}h1{font-size:23px}}
</style>
</head>
<body>
<header><div><div class="brand">STELLA SORA / UI STUDIES</div><h1>同一份招募记录，三种打开方式。</h1><p>选择你喜欢的 UI 方向，浏览总览、记录与设置页面，也可以并排比较。</p></div><div class="tag">UI Beta · 演示数据</div></header>
<main>
<div class="directions" aria-label="选择 UI 方向">
<button class="direction" data-variant="orbit" aria-pressed="true"><span class="swatch a">A</span><span><strong>星轨夜航</strong><small>深海蓝 · 星轨头像 · 侧栏导航</small></span></button>
<button class="direction" data-variant="sky" aria-pressed="false"><span class="swatch b">B</span><span><strong>晴空工作台</strong><small>冰蓝白 · 清晰统计 · 横向导航</small></span></button>
<button class="direction" data-variant="journal" aria-pressed="false"><span class="swatch c">C</span><span><strong>旅人手札</strong><small>雾紫纸张 · 相遇照片 · 收藏档案</small></span></button>
</div>
<div class="toolbar"><div class="pages" aria-label="选择预览页面"><button data-page="home" aria-pressed="true">招募总览</button><button data-page="records" aria-pressed="false">招募记录</button><button data-page="settings" aria-pressed="false">数据与设置</button><button data-page="compact" aria-pressed="false">小窗口效果</button></div><button class="compare" aria-pressed="false">并排比较</button></div>
<div class="frame"><div class="caption"><strong id="caption">A · 星轨夜航 / 招募总览</strong><a id="full" href="screenshots/orbit-home.png" target="_blank" rel="noopener">查看原尺寸 ↗</a></div><img id="preview" src="screenshots/orbit-home.png" alt="A 星轨夜航的招募总览截图"></div>
<div class="comparison" aria-label="三套界面并排比较"></div>
<div class="note"><p>这是界面方案的截图预览。点击“查看原尺寸”可放大查看细节。</p><p>电脑、手机浏览器均可打开</p></div>
<footer>展示内容使用演示记录。网页用于浏览 UI 设计方案；读取游戏和管理真实归档由桌面工具完成。</footer>
</main>
<script>
const names={orbit:'A · 星轨夜航',sky:'B · 晴空工作台',journal:'C · 旅人手札'},pages={home:'招募总览',records:'招募记录',settings:'数据与设置',compact:'小窗口效果'};
let variant='orbit',page='home',comparing=false;
const screenshotSources={};
const screenshotCache={};
function screenshot(key,view){
 const id=`${key}-${view}`,source=screenshotSources[id];
 if(!source)return `screenshots/${id}.png`;
 if(!screenshotCache[id]){
  const bytes=Uint8Array.from(atob(source.split(',')[1]),character=>character.charCodeAt(0));
  screenshotCache[id]=URL.createObjectURL(new Blob([bytes],{type:'image/png'}));
 }
 return screenshotCache[id];
}
function render(){
 document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===variant)));
 document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));
 const src=screenshot(variant,page),description=`${names[variant]} / ${pages[page]}`;
 document.querySelector('#preview').src=src;document.querySelector('#preview').alt=description+'截图';document.querySelector('#caption').textContent=description;document.querySelector('#full').href=src;
 document.querySelector('.frame').classList.toggle('hidden',comparing);
 document.querySelector('.comparison').style.display=comparing?'grid':'none';
 document.querySelector('.compare').textContent=comparing?'返回单张预览':'并排比较';document.querySelector('.compare').setAttribute('aria-pressed',String(comparing));
 const group=document.querySelector('.comparison');group.replaceChildren();
 if(comparing)Object.entries(names).forEach(([key,name])=>{const figure=document.createElement('figure'),caption=document.createElement('figcaption'),link=document.createElement('a'),image=document.createElement('img');caption.textContent=name;image.src=screenshot(key,page);image.alt=name+' / '+pages[page];link.href=image.src;link.target='_blank';link.rel='noopener';link.append(image);figure.append(caption,link);group.append(figure)});
 document.documentElement.style.setProperty('--accent',{orbit:'#357da5',sky:'#216f94',journal:'#755481'}[variant]);
}
document.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>{variant=b.dataset.variant;render()}));
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));
document.querySelector('.compare').addEventListener('click',()=>{comparing=!comparing;render()});
render();
</script>
</body></html>
